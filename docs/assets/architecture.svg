<g fill="none" stroke="#8b96c1" stroke-width="2" marker-end="url(#arrow)"><path d="M250 151H320"/><path d="M250 241H285V151H320"/><path d="M530 151H600"/><path d="M810 151H880"/><path d="M990 184V220"/><path d="M425 184V300H880"/><path d="M705 184V272H880"/><path d="M250 425H360"/><path d="M680 425H880"/></g>
