<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
<title id="title">Rotapot architecture</title><desc id="desc">The treasurer and member interfaces connect to Next.js routes. Claude invokes domain tools and approved contribution verification. A separate treasurer release route calls PayPal Payouts.</desc>
